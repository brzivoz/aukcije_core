# Issue #16: the PostGIS integration-test profile.
#
# This file is the single source of truth for the wiring the integration tests
# assert. Tests activate the profile and read the resolved values back out of
# the Environment; they must never set these properties inline, or they would be
# asserting their own input instead of the application's configuration.
#
# The datasource URL is supplied by Testcontainers; the base application.properties
# pins the H2 driver, so this profile has to name the PostgreSQL one explicitly.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Not applicable off H2.
spring.h2.console.enabled=false
