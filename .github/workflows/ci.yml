name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A superseded push should not keep burning a runner, but never cancel a run on
# the default branch: that is the one whose result other issues cite as evidence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit and PostGIS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.gradle dependencies and the wrapper distribution only.
          # Nothing under build/ is cached: every test report, class file, and
          # migration result in a run must be produced by that run.
          cache: gradle

      - name: Confirm Docker is available for Testcontainers
        run: |
          docker version
          docker info --format 'Server version: {{.ServerVersion}}'

      - name: Pre-pull the database images
        # Pulled explicitly so an image-registry problem is reported as its own
        # failed step rather than as a mysterious container-startup timeout.
        run: |
          docker pull postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3
          docker pull postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

      - name: Run the full test suite
        # `check` includes the Java/PostGIS tests and the Python basemap
        # contract tests without making the ordinary `test` task require
        # a host Python installation.
        run: ./gradlew --no-daemon clean check

      - name: Upload test reports
        # Always, not just on failure: #16 requires a terminal CI result with
        # retained reports, and later issues cite that artifact as their
        # completion evidence. A green run with no artifact proves nothing
        # after the log expires.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # Includes the full basemap unittest transcript, even on failure.
          path: |
            build/reports/tests/test
            build/test-results/test
            build/basemap-test/result.txt
          retention-days: 14
          if-no-files-found: warn

  browser-test:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cache Gradle dependencies and the wrapper only. Browser binaries,
          # test results, screenshots, traces, and build output are always fresh.
          cache: gradle

      - name: Confirm Docker is available for Testcontainers
        run: |
          docker version
          docker info --format 'Server version: {{.ServerVersion}}'

      - name: Pre-pull the PostGIS image
        run: docker pull postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3

      - name: Run the browser suite
        # The property asks Playwright to install Linux system libraries as well
        # as its version-matched Chromium. The task remains one command locally.
        run: ./gradlew --no-daemon browserTest -PplaywrightWithDeps

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          # #25 retains a successful localhost-only multi-zoom map render;
          # failure-only screenshots/traces remain in the next artifact.
          path: |
            build/reports/tests/browserTest
            build/test-results/browserTest
            build/browser-test-results/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: build/browser-test-results/artifacts
          retention-days: 14
          if-no-files-found: warn
