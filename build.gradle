plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'rs.sud.eaukcija'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

def flywayVersion = '11.20.2'
def playwrightVersion = '1.61.0'
def playwrightBrowserDirectory = layout.projectDirectory.dir('.gradle/playwright-browsers')
def playwrightVersionMarker = playwrightBrowserDirectory.file('.playwright-version')

sourceSets {
    browserTest {
        // Gradle already supplies these conventional directories for a named
        // source set. Set them explicitly instead of appending duplicates now
        // that #25 adds binary browser fixtures.
        java.setSrcDirs(['src/browserTest/java'])
        resources.setSrcDirs(['src/browserTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
    propertyReferenceCorpusRuntime
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Spring Boot 3.4.3 manages Flyway 10.x. Pin the newest Java-17 Flyway 11
    // line that retains the configuration API used by Boot 3.4.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core'
    // The schema engine belongs to the offline corpus verifier, not the
    // production Spring Boot runtime. compileOnly keeps its API available to
    // the CLI source set; the dedicated and test configurations execute it.
    compileOnly('com.networknt:json-schema-validator:2.0.4') {
        // The corpus gate reads JSON only and has no date/time formats.
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
        exclude group: 'com.ethlo.time', module: 'itu'
    }
    testImplementation('com.networknt:json-schema-validator:2.0.4') {
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
        exclude group: 'com.ethlo.time', module: 'itu'
    }
    propertyReferenceCorpusRuntime('com.networknt:json-schema-validator:2.0.4') {
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
        exclude group: 'com.ethlo.time', module: 'itu'
    }
    // The official Address Registry is distributed as a GeoPackage (SQLite).
    // The importer reads it row-by-row; no GDAL installation is required.
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'

    // Kept only for the explicitly isolated local-h2 transition profile. The
    // default/dev, test, and prod runtimes all use PostgreSQL/PostGIS.
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    browserTestImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
}

tasks.named('bootRun') {
    // Local Gradle ergonomics only. The packaged application still has no
    // default profile and refuses to start until deployment selects one.
    args = ['--spring.profiles.active=dev']
}

def basemapTestResult = layout.buildDirectory.file('basemap-test/result.txt')
tasks.register('basemapTest', Exec) {
    group = 'verification'
    description = 'Run offline PMTiles source, pin, bundle, and failure-path regressions'
    workingDir projectDir
    commandLine 'python3', 'basemap/tests/run_basemap_tests.py',
            '--output', basemapTestResult.get().asFile.absolutePath
    inputs.files(fileTree('basemap') {
        include '**/*.py', '**/*.sh', '**/*.json', '**/*.yml', '**/*.env', '**/*.lock', '**/*.md'
    })
    outputs.file(basemapTestResult)
    doFirst {
        basemapTestResult.get().asFile.parentFile.mkdirs()
    }
}

tasks.named('test') {
    useJUnitPlatform()

    // Testcontainers falls back to Docker API 1.32 when no version is configured,
    // and Docker Engine 29 rejects anything below its 1.40 minimum. Pin a version
    // both a modern Docker Desktop and the CI runner's engine accept. Override
    // with -Dapi.version=... if a future engine moves the floor again.
    systemProperty 'api.version', System.getProperty('api.version', '1.43')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

tasks.named('check') {
    dependsOn tasks.named('basemapTest')
    dependsOn 'propertyReferenceCorpusCheck'
}

def propertyReferenceCorpusReport = layout.buildDirectory.file(
        'reports/property-reference-corpus/baseline-metrics.json')

tasks.register('propertyReferenceCorpusCheck', JavaExec) {
    group = 'verification'
    description = 'Validate the reviewed property-reference corpus and reproduce its baseline metrics'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + configurations.propertyReferenceCorpusRuntime
    mainClass = 'rs.sud.eaukcija.propertyreference.corpus.PropertyReferenceCorpusCli'
    args = [
            '--corpus-dir', file('corpus/property-references/v1').absolutePath,
            '--report', propertyReferenceCorpusReport.get().asFile.absolutePath,
            '--verify-committed'
    ]
    inputs.files(fileTree('corpus/property-references/v1'))
    outputs.file(propertyReferenceCorpusReport)
}

tasks.register('propertyReferenceCorpusSourceCheck', JavaExec) {
    group = 'verification'
    description = 'Privately verify corpus snapshot/field hashes against the ignored #32 source capture'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + configurations.propertyReferenceCorpusRuntime
    mainClass = 'rs.sud.eaukcija.propertyreference.corpus.PropertyReferenceCorpusCli'
    args = [
            '--corpus-dir', file('corpus/property-references/v1').absolutePath,
            '--report', layout.buildDirectory.file(
                    'reports/property-reference-corpus/source-baseline-metrics.json')
                    .get().asFile.absolutePath,
            '--verify-committed',
            '--source-capture', file('spike/issue-32/out/corpus.json').absolutePath
    ]
    inputs.files(fileTree('corpus/property-references/v1'))
    inputs.file(file('spike/issue-32/out/corpus.json'))
    outputs.file(layout.buildDirectory.file(
            'reports/property-reference-corpus/source-baseline-metrics.json'))
}

def propertyReferenceParserMetrics = layout.buildDirectory.file(
        'reports/property-reference-parser/metrics.json')

tasks.register('propertyReferenceParserDevelopmentCheck', JavaExec) {
    group = 'verification'
    description = 'Evaluate the frozen parser on development labels without opening held-out labels'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.propertyreference.quality.PropertyReferenceQualityCli'
    args = [
            '--corpus-dir', file('corpus/property-references/v1').absolutePath,
            '--report', layout.buildDirectory.file(
                    'reports/property-reference-parser/development-metrics.json')
                    .get().asFile.absolutePath,
            '--development-only'
    ]
    inputs.files(fileTree('corpus/property-references/v1'))
    outputs.file(layout.buildDirectory.file(
            'reports/property-reference-parser/development-metrics.json'))
}

tasks.register('propertyReferenceParserCheck', JavaExec) {
    group = 'verification'
    description = 'Verify frozen issue-19 held-out thresholds and committed parser metrics'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.propertyreference.quality.PropertyReferenceQualityCli'
    def committedMetrics = file('documentation/property-reference-parser-v1-metrics.json')
    args = [
            '--corpus-dir', file('corpus/property-references/v1').absolutePath,
            '--report', propertyReferenceParserMetrics.get().asFile.absolutePath,
            '--expected', committedMetrics.absolutePath
    ]
    inputs.file(committedMetrics)
    inputs.files(fileTree('corpus/property-references/v1'))
    inputs.file(file('src/main/resources/property-reference/parser-v1-quality.json'))
    outputs.file(propertyReferenceParserMetrics)
    // Run away from the repository root so classpath resource loading and all
    // absolute CLI inputs stay continuously covered on every operating system.
    def relocatedWorkingDirectory = layout.buildDirectory.dir(
            'tmp/property-reference-parser-check-cwd')
    workingDir relocatedWorkingDirectory
    doFirst {
        relocatedWorkingDirectory.get().asFile.mkdirs()
    }
}

tasks.named('check') {
    dependsOn 'propertyReferenceParserCheck'
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Install the pinned Playwright Chromium build used by browserTest'
    classpath = configurations.browserTestRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowserDirectory.asFile.absolutePath
    inputs.property 'playwrightVersion', playwrightVersion
    inputs.property 'withOperatingSystemDependencies', project.hasProperty('playwrightWithDeps')
    outputs.dir playwrightBrowserDirectory

    doFirst {
        File marker = playwrightVersionMarker.asFile
        if (marker.exists() && marker.getText('UTF-8').trim() != playwrightVersion) {
            // The directory is generated and ignored. Replacing it on a pin
            // change prevents superseded ~500 MB browser builds accumulating.
            project.delete(playwrightBrowserDirectory)
        }
        setArgs(project.hasProperty('playwrightWithDeps')
                ? ['install', '--with-deps', 'chromium']
                : ['install', 'chromium'])
    }

    doLast {
        playwrightBrowserDirectory.asFile.mkdirs()
        playwrightVersionMarker.asFile.setText(
                playwrightVersion + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('browserTest', Test) {
    group = 'verification'
    description = 'Run the opt-in Playwright browser suite against a seeded PostGIS application'
    dependsOn tasks.named('browserTestClasses')
    dependsOn tasks.named('testClasses')
    dependsOn tasks.named('playwrightInstall')
    shouldRunAfter tasks.named('test')

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath
    useJUnitPlatform()

    systemProperty 'api.version', System.getProperty('api.version', '1.43')
    systemProperty 'browser.headless', System.getProperty('browser.headless', 'true')
    systemProperty 'browser.artifact.dir',
            layout.buildDirectory.dir('browser-test-results/artifacts').get().asFile.absolutePath
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowserDirectory.asFile.absolutePath
    // The installer task owns browser acquisition. Prevent Playwright.create()
    // from filling the shared output directory with unused Firefox/WebKit builds.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

tasks.register('importAddressRegistry', JavaExec) {
    group = 'application'
    description = 'Validate and atomically import an official Address Registry GPKG snapshot'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.AddressRegistryImportCli'
}

tasks.register('buildAddressRegistryCentroids', JavaExec) {
    group = 'application'
    description = 'Derive and atomically publish the small Address Registry centroid extract'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.AddressRegistryCentroidExtractCli'
}

tasks.register('buildKoDictionary', JavaExec) {
    group = 'application'
    description = 'Build and atomically publish the canonical KO dictionary from the active centroid extract'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.KoDictionaryCli'
}

tasks.register('activateBasemap', JavaExec) {
    group = 'application'
    description = 'Validate and atomically activate or roll back an immutable basemap build'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.basemap.BasemapActivateCli'
}

tasks.register('matchStructuredKo', JavaExec) {
    group = 'application'
    description = 'Match structured auction KO fields against the active canonical dictionary'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.komatching.StructuredKoMatchCli'
}

tasks.register('matchExtractedKo', JavaExec) {
    group = 'application'
    description = 'Refresh structured KO results and match current extracted property-reference KO names'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.komatching.ExtractedKoMatchCli'
}

tasks.register('resolveCoarseLocations', JavaExec) {
    group = 'application'
    description = 'Resolve every auction to the best honest KO, settlement, municipality, or NONE tier'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.coarselocation.CoarseLocationResolutionCli'
}
