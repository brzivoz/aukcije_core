plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'rs.sud.eaukcija'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

def flywayVersion = '11.20.2'
def playwrightVersion = '1.61.0'
def playwrightBrowserDirectory = layout.projectDirectory.dir('.gradle/playwright-browsers')
def playwrightVersionMarker = playwrightBrowserDirectory.file('.playwright-version')

sourceSets {
    browserTest {
        java.srcDir 'src/browserTest/java'
        resources.srcDir 'src/browserTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // Spring Boot 3.4.3 manages Flyway 10.x. Pin the newest Java-17 Flyway 11
    // line that retains the configuration API used by Boot 3.4.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core'
    // The official Address Registry is distributed as a GeoPackage (SQLite).
    // The importer reads it row-by-row; no GDAL installation is required.
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'

    // Kept only for the explicitly isolated local-h2 transition profile. The
    // default/dev, test, and prod runtimes all use PostgreSQL/PostGIS.
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    browserTestImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
}

tasks.named('bootRun') {
    // Local Gradle ergonomics only. The packaged application still has no
    // default profile and refuses to start until deployment selects one.
    args = ['--spring.profiles.active=dev']
}

def basemapTestResult = layout.buildDirectory.file('basemap-test/result.txt')
tasks.register('basemapTest', Exec) {
    group = 'verification'
    description = 'Run offline PMTiles source, pin, bundle, and failure-path regressions'
    workingDir projectDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'basemap/tests', '-p', 'test_*.py', '-v'
    inputs.files(fileTree('basemap') {
        include '**/*.py', '**/*.sh', '**/*.json', '**/*.yml', '**/*.env', '**/*.lock', '**/*.md'
    })
    outputs.file(basemapTestResult)
    doFirst {
        basemapTestResult.get().asFile.parentFile.mkdirs()
    }
    doLast {
        basemapTestResult.get().asFile.setText(
                'basemap pipeline tests passed' + System.lineSeparator(), 'UTF-8')
    }
}

tasks.named('test') {
    useJUnitPlatform()

    // Testcontainers falls back to Docker API 1.32 when no version is configured,
    // and Docker Engine 29 rejects anything below its 1.40 minimum. Pin a version
    // both a modern Docker Desktop and the CI runner's engine accept. Override
    // with -Dapi.version=... if a future engine moves the floor again.
    systemProperty 'api.version', System.getProperty('api.version', '1.43')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

tasks.named('check') {
    dependsOn tasks.named('basemapTest')
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Install the pinned Playwright Chromium build used by browserTest'
    classpath = configurations.browserTestRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowserDirectory.asFile.absolutePath
    inputs.property 'playwrightVersion', playwrightVersion
    inputs.property 'withOperatingSystemDependencies', project.hasProperty('playwrightWithDeps')
    outputs.dir playwrightBrowserDirectory

    doFirst {
        File marker = playwrightVersionMarker.asFile
        if (marker.exists() && marker.getText('UTF-8').trim() != playwrightVersion) {
            // The directory is generated and ignored. Replacing it on a pin
            // change prevents superseded ~500 MB browser builds accumulating.
            project.delete(playwrightBrowserDirectory)
        }
        setArgs(project.hasProperty('playwrightWithDeps')
                ? ['install', '--with-deps', 'chromium']
                : ['install', 'chromium'])
    }

    doLast {
        playwrightBrowserDirectory.asFile.mkdirs()
        playwrightVersionMarker.asFile.setText(
                playwrightVersion + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('browserTest', Test) {
    group = 'verification'
    description = 'Run the opt-in Playwright browser suite against a seeded PostGIS application'
    dependsOn tasks.named('browserTestClasses')
    dependsOn tasks.named('testClasses')
    dependsOn tasks.named('playwrightInstall')
    shouldRunAfter tasks.named('test')

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath
    useJUnitPlatform()

    systemProperty 'api.version', System.getProperty('api.version', '1.43')
    systemProperty 'browser.headless', System.getProperty('browser.headless', 'true')
    systemProperty 'browser.artifact.dir',
            layout.buildDirectory.dir('browser-test-results/artifacts').get().asFile.absolutePath
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowserDirectory.asFile.absolutePath
    // The installer task owns browser acquisition. Prevent Playwright.create()
    // from filling the shared output directory with unused Firefox/WebKit builds.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

tasks.register('importAddressRegistry', JavaExec) {
    group = 'application'
    description = 'Validate and atomically import an official Address Registry GPKG snapshot'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.AddressRegistryImportCli'
}

tasks.register('buildAddressRegistryCentroids', JavaExec) {
    group = 'application'
    description = 'Derive and atomically publish the small Address Registry centroid extract'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.AddressRegistryCentroidExtractCli'
}

tasks.register('buildKoDictionary', JavaExec) {
    group = 'application'
    description = 'Build and atomically publish the canonical KO dictionary from the active centroid extract'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.addressregistry.KoDictionaryCli'
}

tasks.register('matchStructuredKo', JavaExec) {
    group = 'application'
    description = 'Match structured auction KO fields against the active canonical dictionary'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.komatching.StructuredKoMatchCli'
}

tasks.register('resolveCoarseLocations', JavaExec) {
    group = 'application'
    description = 'Resolve every auction to the best honest KO, settlement, municipality, or NONE tier'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs.sud.eaukcija.coarselocation.CoarseLocationResolutionCli'
}
