spring.application.name=sud-aukcije

# Common fail-closed PostgreSQL/PostGIS and Flyway policy. Exactly one explicit
# database profile provides the datasource endpoint and credentials.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 is unavailable outside the explicitly activated local-h2 profile.
spring.h2.console.enabled=false

# Fail quickly and visibly when PostgreSQL is unavailable. Flyway validation
# and Hibernate schema validation provide the checksum/schema fail-closed gates.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.flyway.connect-retries=0

# Server
server.port=8081
# Keep the managed worker lifecycle phase inside stop.sh's 30-second grace.
# In-flight HTTP calls are cancelled on ContextClosedEvent; after five seconds
# Spring advances to bean destruction, which interrupts any remaining rate wait.
spring.lifecycle.timeout-per-shutdown-phase=PT5S

# eAukcija API
eaukcija.api.base-url=https://eaukcija.sud.rs/WebApi.Proxy/api/EAukcija
eaukcija.api.root-category-ids=${EAUKCIJA_ROOT_CATEGORY_IDS:7,8}
# The source currently returns the complete measured root-7 population in one
# 3000-item page. Pagination remains strict and defensive if that changes.
eaukcija.api.page-size=${EAUKCIJA_PAGE_SIZE:3000}
eaukcija.api.connect-timeout=${EAUKCIJA_CONNECT_TIMEOUT:PT5S}
eaukcija.api.read-timeout=${EAUKCIJA_READ_TIMEOUT:PT20S}
eaukcija.api.call-timeout=${EAUKCIJA_CALL_TIMEOUT:PT30S}
eaukcija.api.max-attempts=${EAUKCIJA_MAX_ATTEMPTS:3}
eaukcija.api.retry-base-delay=${EAUKCIJA_RETRY_BASE_DELAY:PT0.5S}
eaukcija.api.retry-max-delay=${EAUKCIJA_RETRY_MAX_DELAY:PT10S}
eaukcija.api.max-retry-after=${EAUKCIJA_MAX_RETRY_AFTER:PT2M}
eaukcija.api.requests-per-second=${EAUKCIJA_REQUESTS_PER_SECOND:2.0}
eaukcija.api.max-concurrency=${EAUKCIJA_MAX_CONCURRENCY:1}
eaukcija.api.max-response-bytes=${EAUKCIJA_MAX_RESPONSE_BYTES:16777216}
eaukcija.api.user-agent=${EAUKCIJA_USER_AGENT:aukcije-core/0.0.1}
eaukcija.api.contact=${EAUKCIJA_CONTACT:https://github.com/brzivoz/aukcije_core/issues}

# Complete sync-run orchestration. A disabled schedule ("-") is intentional:
# operators must review the acceptable-use note and set a real cadence.
eaukcija.sync.enabled=${EAUKCIJA_SYNC_ENABLED:true}
eaukcija.sync.detail-stale-after=${EAUKCIJA_DETAIL_STALE_AFTER:P1D}
eaukcija.sync.running-stale-after=${EAUKCIJA_RUNNING_STALE_AFTER:PT15M}
eaukcija.sync.max-pages-per-root=${EAUKCIJA_MAX_PAGES_PER_ROOT:10000}
eaukcija.sync.max-quarantined-listings=${EAUKCIJA_SYNC_MAX_QUARANTINED_LISTINGS:10}
eaukcija.sync.max-quarantined-details=${EAUKCIJA_SYNC_MAX_QUARANTINED_DETAILS:10}
eaukcija.sync.max-errors=${EAUKCIJA_SYNC_MAX_ERRORS:100}
eaukcija.sync.schedule-cron=${EAUKCIJA_SYNC_SCHEDULE_CRON:-}
eaukcija.sync.schedule-zone=${EAUKCIJA_SYNC_SCHEDULE_ZONE:UTC}

# Deterministic #29 enrichment. It shares #17's single managed worker and
# PostgreSQL advisory lock. Scheduling is opt-in; no per-item lease/backoff
# queue exists at the current population size.
eaukcija.enrichment.enabled=${EAUKCIJA_ENRICHMENT_ENABLED:true}
eaukcija.enrichment.max-attempts=${EAUKCIJA_ENRICHMENT_MAX_ATTEMPTS:3}
eaukcija.enrichment.max-interruptions=${EAUKCIJA_ENRICHMENT_MAX_INTERRUPTIONS:3}
eaukcija.enrichment.running-stale-after=${EAUKCIJA_ENRICHMENT_RUNNING_STALE_AFTER:PT15M}
eaukcija.enrichment.max-items-per-run=${EAUKCIJA_ENRICHMENT_MAX_ITEMS_PER_RUN:1000}
eaukcija.enrichment.max-replay-items=${EAUKCIJA_ENRICHMENT_MAX_REPLAY_ITEMS:1000}
eaukcija.enrichment.schedule-cron=${EAUKCIJA_ENRICHMENT_SCHEDULE_CRON:-}
eaukcija.enrichment.schedule-zone=${EAUKCIJA_ENRICHMENT_SCHEDULE_ZONE:Europe/Belgrade}

# The only normal-operation schedule. Manual and scheduled runs enter the same
# durable coordinator. Use '-' as the safe local disable switch.
eaukcija.refresh.enabled=${EAUKCIJA_REFRESH_ENABLED:true}
eaukcija.refresh.schedule-cron=${EAUKCIJA_REFRESH_SCHEDULE_CRON:0 0 3 * * *}
eaukcija.refresh.schedule-zone=${EAUKCIJA_REFRESH_SCHEDULE_ZONE:Europe/Belgrade}
eaukcija.refresh.poll-interval=${EAUKCIJA_REFRESH_POLL_INTERVAL:PT1S}
eaukcija.refresh.running-stale-after=${EAUKCIJA_REFRESH_RUNNING_STALE_AFTER:PT15M}

# Shared #37/#33 KO matcher dictionary. The active pointer and immutable
# version beneath this ignored runtime directory are validated before mutation.
ko.structured-match.dictionary-directory=${KO_STRUCTURED_MATCH_DICTIONARY_DIRECTORY:data/address-registry-ko-dictionary}

# Issue #38 coarse resolver. Only the active, checksum-validated #36 extract is
# accepted as a coordinate source; no online geocoder is part of this path.
coarse.location.centroid-directory=${COARSE_LOCATION_CENTROID_DIRECTORY:data/address-registry-centroids}

# Issue #25 local basemap serving. The directory contains immutable builds and
# the atomically replaced ACTIVE pointer; bundle bytes never live in Git.
basemap.assets.directory=${BASEMAP_ASSET_DIRECTORY:data/basemap}
basemap.assets.poll-interval=${BASEMAP_ASSET_POLL_INTERVAL:PT1S}

# The map keeps the last successful resolution timestamp visible and labels it
# stale once this operator-controlled interval elapses.
map.data.stale-after=${MAP_DATA_STALE_AFTER:PT24H}

# Issue #30 operator status/readiness. External source failures are warnings
# while retained data is inside the freshness window; database, migration,
# basemap, or freshness failures always make readiness fail closed.
operations.status.sync-stale-after=${OPERATIONS_SYNC_STALE_AFTER:PT26H}
operations.status.backlog-max-depth=${OPERATIONS_BACKLOG_MAX_DEPTH:100}
operations.status.backlog-max-age=${OPERATIONS_BACKLOG_MAX_AGE:PT2H}
operations.status.readiness-cache-ttl=${OPERATIONS_READINESS_CACHE_TTL:PT5S}

# Actuator is an operator-only listener, independent of the public application
# connector. The address is intentionally not environment-overridable.
management.server.address=127.0.0.1
management.server.port=${MANAGEMENT_SERVER_PORT:8082}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,pipelineReadiness
management.endpoint.health.validate-group-membership=false

# Machine-readable log context without request bodies, query strings, or other
# source payloads. The HTTP filter supplies correlationId; durable workers also
# log their persisted run/job IDs at each terminal boundary.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} correlationId=%X{correlationId:-none} message=%msg%n
