spring.application.name=sud-aukcije

# H2 in-memory DB
spring.datasource.url=jdbc:h2:file:./data/aukcije;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8081

# eAukcija API
eaukcija.api.base-url=https://eaukcija.sud.rs/WebApi.Proxy/api/EAukcija
eaukcija.api.category-id=7
eaukcija.api.page-size=10
