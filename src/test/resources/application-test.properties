# Testcontainers supplies the JDBC URL and credentials through @ServiceConnection.
# The migration and validation policy is the same as dev/prod.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# Avoid a fixed-port collision between test application contexts while keeping
# the production/common contract on its dedicated loopback listener.
management.server.port=0
