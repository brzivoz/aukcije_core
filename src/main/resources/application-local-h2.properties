# Transitional compatibility profile. It is never active by default and is the
# only place automatic DDL or the H2 console remains available. Archive first:
# Hibernate update may change an older schema when this profile opens it.
spring.datasource.url=${AUKCIJE_H2_URL:jdbc:h2:file:./data/aukcije;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${AUKCIJE_H2_USER:sa}
spring.datasource.password=${AUKCIJE_H2_PASSWORD:}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The transition profile has neither Flyway's sync-run schema nor PostgreSQL
# advisory locks. Durable ingestion is deliberately unavailable here.
eaukcija.sync.enabled=false
eaukcija.enrichment.enabled=false
