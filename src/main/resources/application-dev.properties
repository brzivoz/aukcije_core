# Local PostgreSQL/PostGIS runtime. The password deliberately has no default;
# source it from an ignored secret file as documented in README.md.
spring.datasource.url=${AUKCIJE_DB_URL:jdbc:postgresql://${AUKCIJE_DB_HOST:127.0.0.1}:${AUKCIJE_DB_PORT:5432}/${AUKCIJE_DB_NAME:aukcije}}
spring.datasource.username=${AUKCIJE_DB_USER:aukcije}
spring.datasource.password=${AUKCIJE_DB_PASSWORD}

# Owner-authorized private POC: discover the source contract, retain a stable
# first-observation cache epoch, and refine existing auctions without a button.
# Production/common and test profiles remain off unless explicitly configured.
server.address=${SERVER_ADDRESS:127.0.0.1}
rgz.enabled=${RGZ_ENABLED:true}
rgz.access-mode=${RGZ_ACCESS_MODE:OWNER_AUTHORIZED_AUTOMATIC_PRIVATE_LOCAL_POC}
rgz.auto-configure=${RGZ_AUTO_CONFIGURE:true}
rgz.warmup-enabled=${RGZ_WARMUP_ENABLED:true}
map.auto-refresh-interval-ms=${MAP_AUTO_REFRESH_INTERVAL_MS:15000}
map.initial-longitude=${MAP_INITIAL_LONGITUDE:20.8}
map.initial-latitude=${MAP_INITIAL_LATITUDE:44.0}
map.initial-zoom=${MAP_INITIAL_ZOOM:6}
map.fit-parcels-on-select=${MAP_FIT_PARCELS_ON_SELECT:true}
